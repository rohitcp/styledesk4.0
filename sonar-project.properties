# SonarQube / SonarCloud analysis for StyleDesk
# Run with: sonar-scanner (SONAR_TOKEN and sonar.host.url supplied by the environment/CI)

sonar.projectKey=styledesk
sonar.projectName=StyleDesk
sonar.projectVersion=1.0

# Only first-party code is analysed. vendor/ and node_modules/ are third-party,
# and public/build/ is compiled output — including any of them produces
# thousands of findings nobody will ever action.
sonar.sources=app,config,database,routes,resources/js,resources/css
sonar.tests=tests

sonar.sourceEncoding=UTF-8
sonar.php.file.suffixes=php
sonar.javascript.file.suffixes=.js,.vue

sonar.exclusions=\
  vendor/**,\
  node_modules/**,\
  storage/**,\
  bootstrap/cache/**,\
  public/build/**,\
  html/**,\
  database/migrations/**

# The static prototype in html/ is design reference, not shipped application
# code, and database/migrations are append-only scripts where Sonar's
# duplication and complexity rules generate noise rather than signal.

# Coverage and test reports are produced by:
#   php artisan test --coverage-clover=storage/logs/clover.xml --log-junit=storage/logs/junit.xml
sonar.php.coverage.reportPaths=storage/logs/clover.xml
sonar.php.tests.reportPath=storage/logs/junit.xml
